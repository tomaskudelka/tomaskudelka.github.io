<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Týmový Chat | Live</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1f1f1f; padding: 15px; text-align: center; border-bottom: 2px solid #007bff; }
        
        #chat-box { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }

        /* Společný styl pro bubliny */
        .msg { 
            padding: 10px 15px; 
            border-radius: 18px; 
            max-width: 70%; 
            line-height: 1.4; 
            word-wrap: break-word;
            position: relative;
        }

        /* MOJE ZPRÁVY (Vlevo - Šedé) */
        .msg.moje { 
            align-self: flex-start; 
            background: #333; 
            color: white;
            border-bottom-left-radius: 4px;
        }

        /* ZPRÁVY OSTATNÍCH (Vpravo - Modré) */
        .msg.ostatni { 
            align-self: flex-end; 
            background: #007bff; 
            color: white;
            border-bottom-right-radius: 4px;
        }

        .input-area { padding: 20px; background: #1f1f1f; display: flex; gap: 10px; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #444; background: #333; color: white; outline: none; }
        button { padding: 10px 25px; border-radius: 25px; border: none; background: #007bff; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header><h2 style="margin:0;">Týmový Chat</h2></header>
    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Napište zprávu..." autocomplete="off">
        <button id="send-btn">Odeslat</button>
    </div>

    <script>
        // 1. Nastavení API a unikátního ID pro tento prohlížeč
        const API_KEY = 'VAŠ_ABLY_API_KEY_ZDE'; 
        const MOJE_ID = Math.random().toString(36).substring(7); // Náhodné ID uživatele
        
        const ably = new Ably.Realtime({ key: API_KEY, clientId: MOJE_ID });
        const channel = ably.channels.get('hlavni-chat');

        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');

        // Funkce pro vykreslení zprávy na správnou stranu
        function zobrazZpravu(text, odesilatelId) {
            const div = document.createElement('div');
            // Pokud se ID odesílatele shoduje s mým ID, dám ji vlevo, jinak vpravo
            div.className = (odesilatelId === MOJE_ID) ? 'msg moje' : 'msg ostatni';
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 2. Načtení historie
        channel.history({ limit: 50 }, (err, resultPage) => {
            if (!err) {
                resultPage.items.reverse().forEach(msg => {
                    // Ably ukládá clientId u každé zprávy v historii
                    zobrazZpravu(msg.data, msg.clientId);
                });
            }
        });

        // 3. Příjem nových zpráv
        channel.subscribe('msg', (message) => {
            zobrazZpravu(message.data, message.clientId);
        });

        // 4. Odesílání zpráv
        function odeslat() {
            const text = msgInput.value.trim();
            if (text !== "") {
                // Odesíláme zprávu (Ably automaticky přibalí naše clientId)
                channel.publish('msg', text);
                msgInput.value = '';
            }
        }

        document.getElementById('send-btn').addEventListener('click', odeslat);
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') odeslat(); });
    </script>
</body>
</html>
