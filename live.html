<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Týmový Chat</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1f1f1f; padding: 15px; text-align: center; border-bottom: 2px solid #007bff; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #2a2a2a; padding: 10px 15px; border-radius: 15px; max-width: 80%; align-self: flex-start; line-height: 1.4; border: 1px solid #333; }
        .input-area { padding: 20px; background: #1f1f1f; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: none; border-radius: 25px; background: #333; color: white; outline: none; }
        button { padding: 10px 25px; border-radius: 25px; border: none; background: #007bff; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <header>
        <h2>Společný Chat</h2>
    </header>

    <div id="chat-box">
        </div>

    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Napište zprávu..." autocomplete="off">
        <button id="send-btn">Odeslat</button>
    </div>

    <script>
        // 1. Připojení k Ably (Zde vložte svůj API klíč)
        const API_KEY = 'c7RSNA.08_1eQ:5xgh6jYSoUIUC28zXqxm6ts0U7cWL0rIA6pziA9zUlA'; 
        const ably = new Ably.Realtime(API_KEY);
        const channel = ably.channels.get('hlavni-chat');

        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');

        // 2. Příjem zpráv od ostatních
        channel.subscribe('msg', (message) => {
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerText = message.data;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight; // Automatické odrolování dolů
        });

        // 3. Funkce pro odeslání
        function sendMessage() {
            const text = msgInput.value.trim();
            if (text !== "") {
                channel.publish('msg', text);
                msgInput.value = '';
            }
        }

        // Event listenery
        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
